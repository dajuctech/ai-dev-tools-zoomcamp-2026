{% extends "chores/base.html" %}

{% block content %}
  <section class="panel">
    <h1>{{ title }}</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="form-actions">
        <button type="submit">Save</button>
        <a class="button secondary-button" href="{% url 'chore-list' %}">Cancel</a>
      </div>
    </form>
  </section>
{% endblock %}
