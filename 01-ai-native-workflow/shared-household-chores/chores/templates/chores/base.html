<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shared Household Chores</title>
  <style>
    :root {
      color-scheme: light;
      --border: #d9ddd7;
      --ink: #1e2320;
      --muted: #647068;
      --surface: #ffffff;
      --page: #f6f7f4;
      --accent: #0f766e;
      --accent-dark: #115e59;
      --complete: #556b2f;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    nav,
    main {
      width: min(1040px, calc(100% - 32px));
      margin: 0 auto;
    }

    nav {
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    nav a,
    .button {
      color: var(--accent-dark);
      font-weight: 650;
      text-decoration: none;
    }

    main {
      padding: 28px 0 48px;
    }

    h1,
    h2 {
      line-height: 1.15;
      margin: 0 0 16px;
    }

    .actions,
    .grid,
    .form-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }

    .grid {
      align-items: flex-start;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 18px;
    }

    .primary {
      flex: 2 1 560px;
    }

    .secondary {
      flex: 1 1 280px;
    }

    .chore {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      padding: 14px 0;
      border-top: 1px solid var(--border);
    }

    .chore:first-child {
      border-top: 0;
    }

    .meta {
      color: var(--muted);
      font-size: 0.92rem;
      margin: 4px 0 0;
    }

    label {
      display: block;
      font-weight: 650;
      margin: 0 0 6px;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 6px;
      font: inherit;
      padding: 10px 12px;
      background: #fff;
    }

    form p {
      margin: 0 0 14px;
    }

    button,
    .button {
      border: 1px solid var(--accent);
      border-radius: 6px;
      background: var(--accent);
      color: white;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      min-height: 40px;
      padding: 8px 12px;
      text-decoration: none;
      font: inherit;
      font-weight: 650;
    }

    .button.secondary-button {
      background: transparent;
      color: var(--accent-dark);
    }

    .inline {
      display: inline;
    }

    .status {
      color: var(--complete);
      font-weight: 650;
    }

    .messages {
      list-style: none;
      padding: 0;
      margin: 0 0 16px;
    }

    .messages li {
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #fff;
      padding: 10px 12px;
    }

    @media (max-width: 720px) {
      nav {
        align-items: flex-start;
        flex-direction: column;
        padding: 14px 0;
      }

      .chore {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header>
    <nav>
      <a href="{% url 'chore-list' %}">Shared Household Chores</a>
      <div class="actions">
        <a href="{% url 'chore-create' %}">New chore</a>
        <a href="{% url 'completed-chores' %}">Completed</a>
      </div>
    </nav>
  </header>
  <main>
    {% if messages %}
      <ul class="messages">
        {% for message in messages %}
          <li>{{ message }}</li>
        {% endfor %}
      </ul>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
