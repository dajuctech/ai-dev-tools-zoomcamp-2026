{% extends "retrospectives/base.html" %}

{% block content %}
  <section class="panel">
    <h1>Process Transcript</h1>
    <p class="meta">{{ cycle.project.name }} · {{ cycle.title }}</p>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Process transcript</button>
    </form>
  </section>

  {% if result %}
    <section class="panel" style="margin-top: 16px;">
      <h2>Candidate Outputs</h2>
      <pre>{{ result.extracted_notes }}</pre>
      <a class="button" href="{% url 'summary' cycle.pk %}">Review summary</a>
    </section>
  {% endif %}
{% endblock %}
