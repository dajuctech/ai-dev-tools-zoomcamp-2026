{% extends "retrospectives/base.html" %}

{% block content %}
  <section class="panel">
    <h1>Submit Feedback</h1>
    <p class="meta">{{ cycle.project.name }} · {{ cycle.title }}</p>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Submit feedback</button>
    </form>
  </section>
{% endblock %}
