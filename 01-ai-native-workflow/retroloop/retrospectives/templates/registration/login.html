{% extends "retrospectives/base.html" %}

{% block content %}
  <section class="panel">
    <h1>Log in</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Log in</button>
    </form>
    <p class="meta">No account yet? <a href="{% url 'register' %}">Register</a>.</p>
  </section>
{% endblock %}
